[package]
name = "monocle"
version = "0.8.0"
description = "A standalone markdown viewer with live reload"
authors = ["Daniel McAnulty"]
edition = "2021"

[lib]
name = "monocle_lib"
# Desktop only needs the rlib that main.rs links against. The staticlib/cdylib
# outputs in Tauri's default template exist for iOS/Android, and building all
# three made every incremental edit ~10s instead of ~1s. Restore them if this
# ever targets mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
pulldown-cmark = "0.12"
rfd = "0.15"
dirs = "6"
