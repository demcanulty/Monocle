[package]
name = "render_html"
version = "0.1.0"
edition = "2021"
description = "Monocle's markdown->HTML step for headless PDF export"

[[bin]]
name = "render_html"
path = "render_html.rs"

[dependencies]
# Keep these versions aligned with src-tauri/Cargo.toml so the CLI and the GUI
# parse markdown identically and resolve ~/.config/monocle/custom.css to the
# same path.
pulldown-cmark = "0.12"
dirs = "6"
